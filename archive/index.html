<title>アーカイブ｜Polimill 5年の年表</title>
<meta name="description" content="Polimill株式会社の自社発表699件を、テーマ・年・出典・キーワードで絞り込んで原文に戻れる一覧。">
<link rel="preconnect" href="https://fonts.googleapis.com">

<main id="main">

  <h1 class="msg">全ての出来事は、ここから原文に戻れる</h1>
  <form class="filters" id="filters" role="search" onsubmit="return false">
    <label>テーマ<select id="f-theme"></select></label>

    <label class="kw">キーワード<input type="search" id="f-q" placeholder="例：協定、北海道、PLaMo"></label>
  </form>
  <p class="month-tag" id="archive-month" hidden></p>
  <p class="count" id="archive-count" aria-live="polite"></p>
  <ol class="archive" id="archive"></ol>
  <button type="button" class="more" id="archive-more">もっと見る</button>
</section>
</main>
</div>
